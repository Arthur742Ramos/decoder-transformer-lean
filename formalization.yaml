# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Lean formalization of exact decoder-transformer cache refinement"
  description: >-
    A representation-independent Lean 4 and Mathlib formalization of the
    structural cache-refinement theorem for decoder-only inference.  It
    defines prefix-local sequence semantics and parametric causal attention,
    then proves that incremental projected key-value caching from an empty
    cache returns exactly the same mathematical sequence as full-prefix
    causal evaluation.  It also proves that the final cache is precisely the
    key and value projections of the processed input.  The result is an
    extensional theorem over abstract queries, keys, values, and aggregators;
    it does not claim hardware-level floating-point identity.
  authors:
    - "Arthur Freitas Ramos"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["cs.LG", "cs.LO"]
  msc2020: ["68T07", "03B35"]

sources:
  - title: "Verified Cached Inference for Decoder Transformers"
    authors:
      - "Arthur Freitas Ramos"
    id: "https://github.com/Arthur742Ramos/isabelle-afp-monorepo/tree/b69c6e519c9c810019f3f92e94d6c01e56030947/projects/decoder-transformer-isabelle"
    type: "repository"
    location: "https://github.com/Arthur742Ramos/isabelle-afp-monorepo/tree/b69c6e519c9c810019f3f92e94d6c01e56030947/projects/decoder-transformer-isabelle"
    relationship: "translates"
    note: >-
      This Lean development translates the core prefix-causality and
      full-prefix versus projected KV-cache refinement boundary from the
      cited Isabelle/HOL development.  It preserves the exact semantic
      scope and does not claim a new mathematical result.

related_formalizations:
  - id: "https://arxiv.org/abs/1706.03762"
    relationship: "formalizes concepts from"
    note: >-
      The attention terminology and decoder architecture are motivated by
      the transformer architecture of Vaswani et al.; this repository proves
      a separate abstract cache-refinement theorem.

status:
  scope: >-
    The formalization covers prefix equality, causal sequence operators,
    parametric causal attention, exact projected key-value cache updates, and
    arbitrary finite cached runs.  It does not yet formalize tensor shapes,
    a scalar softmax implementation, multi-head decoder blocks, rotary
    position embeddings, GPT-Neo, or finite-precision error bounds.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "DecoderTransformer.cachedAttention_eq_causalAttention"
    - "DecoderTransformer.finalCache_eq_fullProjections"

automation:
  methods:
    - method: "agent"
      models: ["GPT-5"]
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        Proof engineering with structural induction, list normalization,
        congruence, and exact theorem reuse; the source Isabelle definitions
        and theorem boundary were audited before translation.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local macOS workstation"
      prompting_notes: >-
        Translate the representation-independent prefix and cache theorem,
        preserve the distinction between exact extensional semantics and
        floating-point implementation behavior, and retain source attribution.
  spend_usd: "subscription-based"
  notes: >-
    The formalization was developed with agent assistance.  The final
    development modules contain no proof placeholders and are checked by the
    Lean kernel; the Palomar Challenge file is intentionally statement-only.

fidelity:
  divergences: >-
    Isabelle lists and Lean lists are used for the same finite sequence model,
    with notation adapted to Lean.  The Lean artifact currently translates
    the generic Prefix_Sequences, Causal_Attention, and KV_Cache boundary;
    architecture-specific and numerical Isabelle theories remain planned
    follow-on ports.  No trained checkpoint is part of this artifact.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The source correspondence, theorem statements, and proofs were checked
    locally with the pinned Lean toolchain.  No external peer review is
    claimed, and no Palomar submission or registration is asserted here.

alignment:
  namespace: "DecoderTransformer"
  statements:
    - source: "causal_attention_is_causal"
      lean: "DecoderTransformer.causalAttention_is_causal"
      module: "DecoderTransformer.Attention"
      status: "proved"
      note: "Causal attention preserves every equal input prefix."
    - source: "cached_attention_eq_full_attention"
      lean: "DecoderTransformer.cachedAttention_eq_causalAttention"
      module: "DecoderTransformer.Cache"
      status: "proved"
      note: "The empty-cache incremental run equals full-prefix causal attention."
    - source: "final_cache_eq_full_projections"
      lean: "DecoderTransformer.finalCache_eq_fullProjections"
      module: "DecoderTransformer.Cache"
      status: "proved"
      note: "The final cache contains exactly the processed key and value projections."

acknowledgements: >-
  Mathlib and the Lean community; the Isabelle/HOL source development and its
  author Arthur Freitas Ramos; and Vaswani et al. for the transformer
  architecture that motivates the terminology.
