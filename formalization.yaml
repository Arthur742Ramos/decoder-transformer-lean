# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Lean formalization of decoder-transformer semantics and refinement"
  description: >-
    A Lean 4 and Mathlib development of prefix-local semantics, exact
    attention, shaped tensors, residual decoder blocks, projected KV caches,
    autoregressive generation, GPT-Neo full and windowed caches, grouped-query
    attention, rotary embeddings, SwiGLU, dyadic refinement, IEEE-facing
    certificates, concrete fixtures, and a frozen TinyStories trace.  The
    structural results are extensional over mathematical values; the
    IEEE-facing layer is a self-contained field-level semantic model and does
    not claim hardware-level bit identity.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

repository:
  role: "substantive-development"

classification:
  arxiv: ["cs.LG", "cs.LO"]
  msc2020: ["68T07", "03B35"]

sources:
  - title: "Attention Is All You Need"
    authors:
      - "Ashish Vaswani"
      - "Noam Shazeer"
      - "Niki Parmar"
      - "Jakob Uszkoreit"
      - "Llion Jones"
      - "Aidan N. Gomez"
      - "Lukasz Kaiser"
      - "Illia Polosukhin"
    id: "https://arxiv.org/abs/1706.03762"
    type: "article"
    relationship: "background"
    note: >-
      The attention terminology and decoder architecture are motivated by
      Vaswani et al.; this repository proves architecture-level cached/full
      refinement theorems.

status:
  scope: >-
    The formalization spans prefix equality, causal and exact attention,
    tensor shapes, multi-head and residual blocks, legacy and modern
    incremental caches, GPT-Neo full and bounded stacks, generation,
    projection stability, dyadic error bounds, IEEE-facing certificates,
    concrete checkpoint fixtures, and the frozen TinyStories trace.  The
    IEEE backend uses explicit formats, bitfields, special-value cases, and
    closest-finite-value rounding with an explicit halfway-tie boundary.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "DecoderTransformer.palomarIncrementalModernDecoderRefinesFull"
      file: "DecoderTransformer/PalomarSurface.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "DecoderTransformer.palomarModernGreedyGenerateStepsRefinesFull"
      file: "DecoderTransformer/PalomarSurface.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "DecoderTransformer.palomarCachedModernDyadicNextTokenLogitError"
      file: "DecoderTransformer/PalomarSurface.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["GPT-5"]
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        Proof engineering with structural induction, list normalization,
        congruence, and exact theorem reuse; the public contract and its
        implementation boundary were audited before submission.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local macOS workstation"
      prompting_notes: >-
        State architecture-level cache/full refinement with explicit
        well-formedness, distinguish totalized list behavior from advertised
        positive-vocabulary claims, and preserve the project attribution.
  spend_usd: "subscription-based"
  notes: >-
    AI assistance was used for proof engineering. The final definitions,
    statements, and proofs in the library and Solution module are checked by
    Lean. Challenge theorem declarations are intentionally admitted as the
    independent comparator contract; their compared definitions are concrete
    and auditable.

fidelity:
  divergences: >-
    Lean lists model finite sequences and totalized list operations make
    behavior defined even for malformed inputs.  The IEEE-facing layer is a
    self-contained field-level backend with normal/subnormal decoding,
    special-value classification, fused multiply-add cases, and a
    closest-finite-value metric theorem.  It makes no claim of hardware
    bit-identical FP16 or FP32 execution.  The dyadic module is an executable
    finite-grid error model.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    This corrected snapshot responds to automated review by replacing opaque
    semantic declarations with concrete contract definitions, adding an
    explicit nonempty common-dimension stack predicate, and adding positive
    vocabulary hypotheses to the generation and logit claims.  The full
    library, wrapper statements, proofs, imports, and checkpoint payload were
    checked locally with the pinned Lean toolchain.  No external peer review
    or public registration is claimed.

acknowledgements: >-
  Mathlib and the Lean community; and Vaswani et al. for the transformer
  architecture that motivates the terminology.
