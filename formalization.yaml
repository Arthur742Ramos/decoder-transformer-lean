# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Lean formalization of decoder-transformer semantics and refinement"
  description: >-
    A complete Lean 4 and Mathlib translation of the 34-theory Isabelle/HOL
    decoder-transformer development.  It covers prefix-local semantics,
    exact attention, shaped tensors, residual decoder blocks, projected KV
    caches, autoregressive generation, GPT-Neo full and windowed caches,
    grouped-query attention, rotary embeddings, SwiGLU, dyadic refinement,
    IEEE-facing certificates, concrete fixtures, and the frozen TinyStories
    trace.  The structural theorem is extensional over mathematical values;
    the IEEE-facing layer is a self-contained field-level semantic model and
    does not claim hardware-level bit identity.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

repository:
  role: "substantive-development"

classification:
  arxiv: ["cs.LG", "cs.LO"]
  msc2020: ["68T07", "03B35"]

sources:
  - title: "Verified Decoder-Transformer Inference Semantics"
    authors:
      - "Arthur Freitas Ramos"
      - "David Barros Hulak"
      - "Ruy J. G. B. de Queiroz"
    id: "https://github.com/Arthur742Ramos/decoder-transformer-lean"
    type: "repository"
    location: "isabelle/decoder-transformer-isabelle"
    relationship: "adapts"
    note: >-
      The Isabelle/HOL source is vendored in this public repository at
      isabelle/decoder-transformer-isabelle/ as a source-only snapshot from
      revision b69c6e519c9c810019f3f92e94d6c01e56030947.  This Lean development
      translates the full source boundary, with the Palomar comparator
      selecting the modern grouped-query/RoPE/SwiGLU cached/full refinement
      theorem, its multi-step greedy-generation composition, and the dyadic
      next-token logit error theorem.  The architecture-specific, legacy,
      GPT-Neo, certificate, and checkpoint theory boundaries are also retained
      in the complete port.
      The theory files are unchanged in the vendored snapshot; the document
      metadata records the complete project authorship.  No new mathematical
      result is claimed.
  - title: "Attention Is All You Need"
    authors:
      - "Ashish Vaswani"
      - "Noam Shazeer"
      - "Niki Parmar"
      - "Jakob Uszkoreit"
      - "Llion Jones"
      - "Aidan N. Gomez"
      - "Lukasz Kaiser"
      - "Illia Polosukhin"
    id: "https://arxiv.org/abs/1706.03762"
    type: "article"
    relationship: "background"
    note: >-
      The attention terminology and decoder architecture are motivated by
      the transformer architecture of Vaswani et al.; this repository proves
      architecture-level cached/full refinement theorems.

status:
  scope: >-
    The formalization covers all 34 source theory boundaries: prefix equality,
    causal and exact attention, tensor shapes, multi-head and residual blocks,
    legacy and modern incremental caches, GPT-Neo full and bounded stacks,
    generation, projection stability, dyadic error bounds, IEEE-facing
    certificates, concrete checkpoint fixtures, and the frozen TinyStories
    trace.  The parameterized bit-level AFP IEEE library used by Isabelle is
    represented by a self-contained Lean field-level model with explicit
    formats, bitfields, special values, and closest-finite-value rounding;
    the exact halfway-tie preference remains explicit.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "DecoderTransformer.incremental_modern_decoder_equals_full"
      file: "DecoderTransformer/ModernIncremental.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "DecoderTransformer.modernGreedyGenerateStepsEqFull"
      file: "DecoderTransformer/ModernGeneration.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "DecoderTransformer.cached_modern_dyadic_next_token_logit_error"
      file: "DecoderTransformer/DyadicFinitePrecision.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["GPT-5"]
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        Proof engineering with structural induction, list normalization,
        congruence, and exact theorem reuse; the source Isabelle definitions
        and theorem boundary were audited before translation.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local macOS workstation"
      prompting_notes: >-
        Select and translate architecture-level cache/full refinement results,
        preserve the distinction between exact extensional semantics and
        finite-precision error bounds, and retain source attribution.
  spend_usd: "subscription-based"
  notes: >-
    The formalization was developed with agent assistance.  The library and
    Solution module contain no proof placeholders and are checked by the Lean
    kernel.  Challenge intentionally contains opaque typed declarations as an
    independent Comparator surface; its holes are not part of the proved
    development.

fidelity:
  divergences: >-
    Isabelle lists and Lean lists are used for the same finite sequence model,
    with notation adapted to Lean.  The source's parameterized AFP IEEE-754
    theory is not imported by this Lean project, so IEEEFormat and IEEEFloat
    provide a self-contained field-level backend with normal/subnormal
    decoding, special-value classification, source-compatible FMA branches,
    and a closest-finite-value metric theorem.  The frozen TinyStories
    sign/exponent/mantissa payload and all source certificate boundaries are
    retained.  The artifact makes no claim of hardware bit-identical FP16 or
    FP32 execution, and preserves the source's explicit halfway-tie boundary.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    An earlier automated Palomar review found the former generic comparator
    surface insufficiently research-substantive.  This corrected snapshot
    replaces it with architecture-level cache/full refinement, generation,
    and quantitative finite-precision results.  The source correspondence,
    theorem statements, proofs, full import root, and checkpoint payload were
    checked locally with the pinned Lean toolchain.  No external peer review
    is claimed, and this snapshot makes no claim of successful Palomar intake,
    review, or registration.

alignment:
  namespace: "DecoderTransformer"
  statements:
    - source: "incremental_modern_decoder_equals_full"
      lean: "DecoderTransformer.incremental_modern_decoder_equals_full"
      module: "DecoderTransformer.ModernIncremental"
      status: "proved"
      note: "A valid modern cached stack step equals the last row of full-prefix evaluation."
    - source: "modern_greedy_generate_steps_eq_full"
      lean: "DecoderTransformer.modernGreedyGenerateStepsEqFull"
      module: "DecoderTransformer.ModernGeneration"
      status: "proved"
      note: "The modern cache/full refinement composes over arbitrary greedy generation steps."
    - source: "cached_modern_dyadic_next_token_logit_error"
      lean: "DecoderTransformer.cached_modern_dyadic_next_token_logit_error"
      module: "DecoderTransformer.DyadicFinitePrecision"
      status: "proved"
      note: "The cached modern next-token logits satisfy the model-dimension dyadic error bound."

acknowledgements: >-
  Mathlib and the Lean community; the Isabelle/HOL source development and its
  authors Arthur Freitas Ramos, David Barros Hulak, and Ruy J. G. B. de Queiroz;
  and Vaswani et al. for the transformer
  architecture that motivates the terminology.
